---
- name: kernel set
  hosts: all
  become: yes
  vars_files:
  - ../vars/kernel.yml
  tasks:
  - name: configuration modules
    block: 
    - name: Load kernel modules (temporary)
      modprobe:
        name: "{{ item }}"
        state: present
      loop: "{{ kernel_modules }}"

    - name: Persist modules at boot
      lineinfile:
        path: /etc/modules-load.d/modules.conf
        line: "{{ item }}"
        state: present
        create: yes 
      loop: "{{ kernel_modules }}"

    - name: load net.ipv4.ip_forward
      sysctl:
        name: net.ipv4.ip_forward
        value: 1
        state: present
        sysctl_file: /etc/sysctl.d/forward.conf
        reload: yes

  - name: swap off
    block:
    - name: command swapoff
      command: swapoff -a

    - name: umount swap
      lineinfile:
        path: /etc/fstab
        regexp: '^\\s*([^#].*\\sswap.*)$'
        state: absent
