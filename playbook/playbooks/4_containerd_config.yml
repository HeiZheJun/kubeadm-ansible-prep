---
- name:  containerd config init
  hosts: all
  become: yes
  handlers:
  - name: restart containerd
    systemd:
      name: containerd
      state: restarted
    
  tasks:
  - name: create containerd config directory
    file:
      path: /etc/containerd 
      state: directory
      mode: 0755
      group: root
      owner: root
      
  - name: import default config
    shell: | 
      containerd config default > /etc/containerd/config.toml
    args:
      creates: /etc/containerd/config.toml
  
  - name: set SystemdCgroup true
    replace:
      path: /etc/containerd/config.toml
      regexp: "^(\\s*SystemdCgroup\\s*=\\s*).*"
      replace: \1true
    notify: restart containerd
    
  - name: set pause images url
    replace:
      path: /etc/containerd/config.toml
      regexp: "registry.k8s.io/pause"
      replace: registry.aliyuncs.com/google_containers/pause
    notify: restart containerd    

  - name: start containerd
    systemd:
      name: containerd
      state: started
      enabled: true